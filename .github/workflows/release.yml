name: release

on:
  release:
    types:
      - published

permissions: {}

env:
  MISE_LOCKED: 1

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch main too, to check that the tag is its latest commit
          persist-credentials: false

      - name: Check that the tag is main's latest commit
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "${GITHUB_REF_NAME} isn't the main branch's latest commit." >&2
            exit 1
          fi

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.11

      - name: Build the package, versioned by the tag
        run: mise exec -- uv build

      - name: Check that the version is the tag's
        run: |
          ls dist
          test -f "dist/rootle-${GITHUB_REF_NAME#v}.tar.gz"
          test -f "dist/rootle-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      # Install the wheel we just built, not this checkout's source, into a throwaway
      # environment, and check that every public module imports.
      - name: Check that the wheel installs and imports
        run: |
          mise exec -- uv run --isolated --no-project \
            --with "dist/rootle-${GITHUB_REF_NAME#v}-py3-none-any.whl" \
            python -c "import rootle, rootle.testing, rootle.winerror"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: dist
          path: dist/

  publish:
    environment:
      name: pypi
      url: https://pypi.org/p/rootle

    needs: build

    permissions:
      id-token: write  # PyPI's trusted publishing proves where the release came from

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish the package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
