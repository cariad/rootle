name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

env:
  MISE_LOCKED: 1

jobs:
  build-docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.11

      - name: Build the documentation site
        run: mise run docs:build

      - name: Upload the artefact to be published
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.11

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint Python files
        run: mise run lint:python

      - name: Lint TOML files
        run: mise run lint:toml

      - name: Check types
        run: mise run lint:types

      - name: Audit GitHub Actions files
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:workflows

  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.11

      - name: Run the tests
        run: mise run test

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build-docs
      - lint
      - test

    concurrency:
      cancel-in-progress: false
      group: pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      id-token: write
      pages: write

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Publish the documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
